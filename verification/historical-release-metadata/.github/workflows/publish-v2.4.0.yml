name: Publish manuscript v2.4.0
on:
  push:
    branches: [main]
    paths: [revision-v2.4.0/release.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed assets
        working-directory: revision-v2.4.0
        run: |
          sha256sum -c SHA256SUMS.txt
          python -m zipfile -t tex.zip
      - name: Publish or refresh assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          folder=revision-v2.4.0
          title='Zeta Zeros and Signed Liouville Energies'
          if gh release view v2.4.0 >/dev/null 2>&1; then
            gh release upload v2.4.0 "$folder/paper.pdf" "$folder/tex.zip" "$folder/SHA256SUMS.txt" --clobber
            gh release edit v2.4.0 --title "$title" --notes-file "$folder/RELEASE-NOTES.md"
          else
            gh release create v2.4.0 "$folder/paper.pdf" "$folder/tex.zip" "$folder/SHA256SUMS.txt" --target "$(git rev-parse HEAD)" --title "$title" --notes-file "$folder/RELEASE-NOTES.md"
          fi

name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" papers/RiemannPaper.pdf --target "$GITHUB_SHA" --title "Liouville Energy and the Rightmost Zeta Zero ($TAG)" --notes "Liouville Energy and the Rightmost Zeta Zero. Paper, Lean 4 project (21 theorems) and Julia programs. The Riemann hypothesis is not proved."

name: Verify the Zenodo archive

on:
  push:
    branches: [main]
    paths: [archive-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify the public archive
        run: python scripts/verify_archive.py
      - name: Record the verified DOI
        if: always()
        run: |
          git config user.name "Deep Bhattacharjee"
          git config user.email "itsdeep@live.com"
          for file in docs/ZENODO-ARCHIVE.json docs/ARCHIVE-SEARCH.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record the v2.0.0 Zenodo verification result"
            git push origin HEAD:main
          fi

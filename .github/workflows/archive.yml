name: Verify the Zenodo archive

on:
  push:
    branches: [main]
    paths: [archive-request.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify the public archive
        run: python scripts/verify_archive.py
      - name: Record the verified DOI
        run: |
          git config user.name "Deep Bhattacharjee"
          git config user.email "itsdeep@live.com"
          git add docs/ZENODO-ARCHIVE.json
          if ! git diff --cached --quiet; then
            git commit -m "Record the verified v2.0.0 Zenodo DOI"
            git push origin HEAD:main
          fi

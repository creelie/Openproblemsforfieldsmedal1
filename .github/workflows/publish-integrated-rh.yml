name: Publish integrated rh manuscript
on:
  push:
    branches: [main]
    paths: [revision-v2.7.0/release.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed assets
        working-directory: revision-v2.7.0
        run: |
          sha256sum -c SHA256SUMS.txt
          python -m zipfile -t RHtex.zip
          python -m zipfile -t RH.zip
      - name: Publish or refresh assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          folder=revision-v2.7.0
          title='Zero-Free Criteria from Signed Liouville Energies'
          if gh release view v2.7.0 >/dev/null 2>&1; then
            gh release upload v2.7.0 "$folder/RH.pdf" "$folder/RHtex.zip" "$folder/RH.zip" "$folder/SHA256SUMS.txt" --clobber
            gh release edit v2.7.0 --title "$title" --notes-file "$folder/RELEASE-NOTES.md"
          else
            gh release create v2.7.0 "$folder/RH.pdf" "$folder/RHtex.zip" "$folder/RH.zip" "$folder/SHA256SUMS.txt" --target "$(git rev-parse HEAD)" --title "$title" --notes-file "$folder/RELEASE-NOTES.md"
          fi
